name: temporary-format-ai

on:
  push:
    branches: [fix/ai-reliability-hedged-failover]
    paths:
      - .github/workflows/temporary-format-ai.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ai-reliability-hedged-failover
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write api/ai.js src/api-gateway.test.js
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/ai.js src/api-gateway.test.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format AI reliability changes"
          git push origin HEAD:fix/ai-reliability-hedged-failover
