name: temporary-format

on:
  push:
    branches: [feat/tradeoff-decision-lab]
    paths:
      - .github/workflows/temporary-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/tradeoff-decision-lab
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/components/DecisionMatrix.tsx src/styles.css
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/DecisionMatrix.tsx src/styles.css
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git commit -m "style: format responsive matrix"
          git push origin HEAD:feat/tradeoff-decision-lab
