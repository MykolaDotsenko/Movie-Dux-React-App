name: tradeoff-bootstrap

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/tradeoff-decision-lab]
    paths: [.tradeoff-bootstrap.tar.gz.b64]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event_name == 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/tradeoff-decision-lab
      - name: Replace legacy CRA with Tradeoff source
        shell: bash
        run: |
          base64 --decode .tradeoff-bootstrap.tar.gz.b64 > /tmp/tradeoff-source.tar.gz
          mkdir -p /tmp/tradeoff-source
          tar -xzf /tmp/tradeoff-source.tar.gz -C /tmp/tradeoff-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/tradeoff-source/. .
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install, format and verify
        run: |
          npm install --no-audit --no-fund
          npm run format
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Commit rebuilt product
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          rm -rf node_modules dist coverage playwright-report test-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: rebuild as Tradeoff Decision Lab"
          git push origin HEAD:feat/tradeoff-decision-lab
