name: temporary-production-screenshots

on:
  push:
    branches: [chore/recruiter-polish]
    paths:
      - .github/workflows/temporary-production-screenshots.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/recruiter-polish
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-production-screenshots.mjs https://tradeoff-decision-lab.vercel.app
      - name: Commit production screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: capture production screenshots"
          git push origin HEAD:chore/recruiter-polish
